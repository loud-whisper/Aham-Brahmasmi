name: Foundation checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rehearsal isolation dependency
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version

      - name: Run foundation verification
        run: python3 tests/verify_foundation.py

      - name: TEMPORARY sandbox privilege-drop diagnostics
        continue-on-error: true
        run: |
          set +e
          U=$(id -u); G=$(id -g)
          echo "== versions =="; cat /etc/os-release | head -4; uname -r; bwrap --version; setpriv --version
          echo "== apparmor =="; sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>&1
          sudo aa-status 2>/dev/null | grep -iE 'bwrap|profiles are loaded|setpriv' ; ls /etc/apparmor.d | grep -iE 'bwrap|setpriv'
          B="sudo --non-interactive bwrap --die-with-parent --new-session --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp"
          echo "== T10 same call through a copy of bwrap outside the AppArmor profile path =="
          cp /usr/bin/bwrap /tmp/bwrap-copy
          sudo --non-interactive /tmp/bwrap-copy --die-with-parent --new-session --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp -- sh -c "cat /proc/self/attr/current; echo; setpriv --reuid=$U --regid=$G --clear-groups --inh-caps=-all --bounding-set=-all --no-new-privs -- id"; echo "rc=$?"
          echo "== T11 unprivileged bwrap, no sudo =="
          bwrap --die-with-parent --new-session --unshare-all --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp -- sh -c 'id; cat /proc/self/attr/current; echo; grep -E "^Cap(Prm|Eff|Bnd)" /proc/self/status'; echo "rc=$?"
          echo "== T12 unprivileged bwrap with network kept =="
          bwrap --die-with-parent --new-session --unshare-all --share-net --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp -- id; echo "rc=$?"
          echo "== T13 sandbox test files without the sudo helper =="
          python3 -m unittest -v tests.test_m5_rehearsal_sandbox tests.test_m5_live_rehearsal_isolation tests.test_astra_m6_live_evidence_emission tests.test_runtime_negative_path_rehearsal tests.test_runtime_switch_recovery tests.test_runtime_switch_handoff_containment 2>&1 | grep -vE ' \.\.\. ok$' | tail -40
          exit 0

      - name: Run unit tests
        env:
          AHAM_TEST_BWRAP_SUDO_HELPER: "1"
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  portability-matrix:
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: portability-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run foundation verification
        run: python tests/verify_foundation.py

      - name: Run cross-platform core suite
        run: python tests/run_portability_suite.py

  windows-core:
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: windows-native-core-py3.14
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run foundation verification
        run: python tests/verify_foundation.py
      - name: Verify independent-process writer concurrency and recovery
        run: python -m unittest discover -s tests -p test_astra_m2.py -v
      - name: Run native Windows core portability suite
        run: python tests/run_portability_suite.py
